  --accent:#1E6B56; --accent-press:#175544; --on-accent:#FFFFFF; --accent-soft:#E1EEE7; --accent-ink:#1A6450;
  --warn:#8A5300; --warn-soft:#F6EAD2;
  --info:#285A80; --info-soft:#E2EBF3;
  --danger:#A3352A; --danger-soft:#F7E2DE;
  --neutral-soft:#E7ECE6; --hatch:#98A39D;
  --scrim:rgba(14,22,18,.42);
  --stage:#DCE2DB; --bezel:#1B2420;
  --shadow-float:0 12px 24px -10px rgba(18,70,52,.55);
  --shadow-sheet:0 -14px 40px rgba(10,30,22,.14);
  --knob:#FFFFFF;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --paper:#101613; --surface:#18201C; --surface-2:#202A25; --surface-3:#2B3631;
  --ink:#E2E9E5; --ink-2:#A3B0A9; --ink-3:#7D8A83; --rule:#28332E;
  --accent:#5DBE9B; --accent-press:#4FAA89; --on-accent:#0B1712; --accent-soft:#1C362D; --accent-ink:#86D4B8;
  --warn:#E5B465; --warn-soft:#382D18;
  --info:#97BCE0; --info-soft:#1C2935;
  --danger:#EE9C8E; --danger-soft:#3A211D;
  --neutral-soft:#26302B; --hatch:#6E7B74;
  --scrim:rgba(0,0,0,.58);
  --stage:#0A0E0C; --bezel:#2A332E;
  --shadow-float:0 12px 24px -10px rgba(0,0,0,.7);
  --shadow-sheet:0 -14px 40px rgba(0,0,0,.5);
  --knob:#E2E9E5;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--stage);color:var(--ink);font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;transition:background-color .3s}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:0}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
bdi{unicode-bidi:isolate}
.ic{flex:none;display:block}
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
p{margin:0}

/* ---------- Device stage ---------- */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 16px}
.device{position:relative;width:390px;height:min(844px,calc(100vh - 96px));min-height:640px;flex:none;border-radius:46px;overflow:hidden;background:var(--paper);box-shadow:0 0 0 11px var(--bezel),0 0 0 12px rgba(0,0,0,.08),0 40px 90px -24px rgba(10,30,20,.38);display:flex;flex-direction:column;isolation:isolate;transition:background-color .3s}
.stage-note{font-size:13.5px;color:var(--ink-2);text-align:center}
.statusbar{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0;direction:ltr;font-size:15px;font-weight:700;color:var(--ink)}
.sb-icons{display:flex;gap:6px;align-items:center}
.sb-icons i{display:block;background:currentColor;border-radius:2px}
@media (max-width:520px){
  .stage{padding:0;display:block}
  .device{width:100%;height:100vh;height:100dvh;min-height:0;border-radius:0;box-shadow:none}
  .statusbar,.stage-note{display:none}
}

/* ---------- App shell ---------- */
.app{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.anim-push{animation:pushIn .3s cubic-bezier(.2,.8,.2,1)}
.view.anim-pop{animation:popIn .3s cubic-bezier(.2,.8,.2,1)}
.view.anim-fade{animation:fadeIn .22s ease-out}
@keyframes pushIn{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.end-space{height:32px}
.fab-space{height:96px}

.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--rule)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;font-size:12.5px;font-weight:700;color:var(--ink-3)}
.nav-ico{width:58px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background-color .2s}
.nav button[aria-current="page"]{color:var(--accent-ink)}
.nav button[aria-current="page"] .nav-ico{background:var(--accent-soft)}

.fab{position:absolute;z-index:20;bottom:calc(86px + env(safe-area-inset-bottom));inset-inline-end:16px;height:56px;border-radius:18px;padding:0 18px 0 22px;border:0;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-float)}
.fab:active{background:var(--accent-press)}
.fab[hidden]{display:none}

/* ---------- Headers ---------- */
.hdr{display:flex;align-items:flex-start;gap:8px;padding:20px 20px 0 10px}
.hdr-main{flex:1;min-width:0}
.title{margin:0;font-size:26px;font-weight:800;line-height:1.3}
.ws-btn{display:inline-flex;align-items:center;gap:6px;margin-top:2px;padding:4px 0;border:0;background:none;font-size:14.5px;font-weight:500;color:var(--ink-2)}
.ws-btn .ic:last-child{color:var(--ink-3)}
.topbar{display:flex;align-items:center;justify-content:space-between;height:54px;padding:4px 6px 0}
.topbar-end{display:flex;align-items:center}
.back{display:inline-flex;align-items:center;gap:2px;height:44px;padding:0 8px;border:0;border-radius:12px;background:none;font-size:16px;font-weight:700;color:var(--accent-ink)}
.back:active{background:var(--neutral-soft)}
.phead{padding:2px 20px 0}
.pmeta{margin-top:4px;font-size:14.5px;color:var(--ink-2)}
.facts{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:4px;font-size:14px;color:var(--ink-2)}
.facts span{white-space:nowrap}
.facts b{font-weight:700;color:var(--ink)}

.icon-btn{width:44px;height:44px;flex:none;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:active{background:var(--neutral-soft)}
.icon-btn.sm{width:40px;height:40px}

/* ---------- Layout ---------- */
.pad{padding:0 16px}
.section{margin-top:26px;padding:0 16px}
.section-hd{display:flex;align-items:center;justify-content:space-between;min-height:32px;padding:0 6px 8px}
.section-hd h2{margin:0;font-size:15.5px;font-weight:700}
.section-hd .aside{font-size:13.5px;color:var(--ink-2)}
.hd-actions{display:flex;gap:4px}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.grow{flex:1}
.center{text-align:center}
.muted{color:var(--ink-2)}
.caption{margin:10px 6px 0;font-size:13px;line-height:1.65;color:var(--ink-2)}

/* ---------- Grouped lists ---------- */
.group{background:var(--surface);border-radius:20px;overflow:hidden}
.group > *{position:relative}
.group > * + *::before{content:"";position:absolute;top:0;inset-inline-start:var(--sep,66px);inset-inline-end:0;height:1px;background:var(--rule)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:66px;padding:12px 16px;border:0;background:none;text-align:start}
button.row:active,.row-main:active{background:var(--surface-2)}
.row:disabled{opacity:.48}
.row[data-busy]:disabled{opacity:1}
.row.static{padding-inline-end:8px}
.row-main{display:flex;align-items:center;gap:14px;flex:1;min-width:0;align-self:stretch;margin:-12px 0;padding:12px 0;border:0;background:none;text-align:start;border-radius:0}
.row-ico{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.row-ico.on,.row-ico.accent{background:var(--accent-soft);color:var(--accent-ink)}
.row-ico.logo{background:none;overflow:hidden}
.row-ico.logo img{width:38px;height:38px;display:block}
.row-body{flex:1;min-width:0;display:block}
.row-title{display:block;font-size:16px;font-weight:700;line-height:1.45}
.row-title.accent-text{color:var(--accent-ink)}
.row-sub{display:block;margin-top:1px;font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.row-sub.warn-text{color:var(--warn)}
.row-end{display:flex;align-items:center;gap:8px;color:var(--ink-3);flex:none}
.count{font-size:14px;font-weight:700;color:var(--ink-2)}
.dots{display:flex}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--surface)}
.dots i + i{margin-inline-start:-4px}

/* period rows */
.prow{--sep:70px;display:flex;align-items:center;gap:4px;padding:14px 6px 14px 16px;padding-inline:16px 6px}
.prow .row-main{gap:14px}
.prow .row-ico{width:40px;height:40px}
.st{font-weight:700}
.st-ok{color:var(--accent-ink)}.st-wait{color:var(--warn)}.st-run{color:var(--info)}.st-lock{color:var(--ink-2)}.st-fail{color:var(--danger)}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--accent-soft);color:var(--accent-ink)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.run{background:var(--info-soft);color:var(--info)}
.pill.lock,.pill.neutral{background:var(--neutral-soft);color:var(--ink-2)}
.pill.fail{background:var(--danger-soft);color:var(--danger)}
.pill.run .ic{animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 20px;border:0;border-radius:16px;font-size:16px;font-weight:700;white-space:nowrap}
.btn-block{display:flex;width:100%}
.btn-primary{background:var(--accent);color:var(--on-accent)}
.btn-primary:active{background:var(--accent-press)}
.btn-secondary{background:var(--accent-soft);color:var(--accent-ink)}
.btn-quiet{background:transparent;color:var(--accent-ink)}
.btn-quiet:active,.btn-secondary:active{filter:brightness(.96)}
.btn-danger{background:var(--danger);color:#fff}
:root[data-theme="dark"] .btn-danger{color:#1A0D0A}
.btn-sm{height:40px;padding:0 14px;border-radius:12px;font-size:14.5px}
.btn:disabled{opacity:.42}
.link{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 8px;border:0;border-radius:10px;background:none;font-size:14.5px;font-weight:700;color:var(--accent-ink)}
.link:active{background:var(--accent-soft)}

/* ---------- The matching strip: rows painted with the sheet's own colors ---------- */
.strip{display:flex;gap:2px;height:8px;border-radius:999px;overflow:hidden}
.strip > i{display:block;height:100%;min-width:4px;flex-basis:0}
.strip-sm{height:4px;margin-top:9px}
.s-none,.key.hatch{background-color:var(--neutral-soft);background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1.5px,transparent 1.5px 4.5px)}
.strip.is-empty{background:var(--surface-3)}
.strip-wrap{position:relative}
.strip-wrap .fill{position:absolute;inset:0;transition:clip-path .75s cubic-bezier(.3,.7,.2,1)}
.key{display:block;width:12px;height:12px;border-radius:4px;flex:none}

/* ---------- Hero period ---------- */
.hero{margin-top:18px;padding:16px 20px 20px;border-radius:26px;background:var(--surface)}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-inline-end:-10px}
.hero-title{margin:10px 0 0;font-size:22px;font-weight:800;line-height:1.35}
.hero-meta{margin:2px 0 18px;font-size:14.5px;color:var(--ink-2)}
.hero-foot{margin:10px 0 18px;font-size:14px;color:var(--ink-2)}
.hero-foot b{color:var(--ink);font-weight:700}

/* ---------- Audit screen ---------- */
.banner{display:flex;align-items:center;gap:12px;margin:16px 16px 0;padding:12px 14px;border-radius:18px;background:var(--neutral-soft)}
.banner > .ic{color:var(--ink-2)}
.banner > div{flex:1;min-width:0}
.banner b{display:block;font-size:15px}
.banner span{display:block;font-size:13px;color:var(--ink-2)}
.ready{padding:22px 6px 0}
.ready p{margin-top:12px;font-size:14.5px;color:var(--ink-2)}
.run-card,.results{margin-top:18px;padding:18px 20px 20px;border-radius:26px;background:var(--surface)}
.run-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.run-title{font-size:18px;font-weight:800}
.run-step{font-size:13.5px;font-weight:700;color:var(--ink-2)}
.run-label{display:flex;align-items:center;gap:6px;margin-top:14px;font-size:15px}
.run-label.waiting{color:var(--warn)}
.res-head{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2)}
.done-mark{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.hero-num{display:flex;align-items:baseline;gap:10px;margin:10px 0 14px}
.hero-num .num{font-size:46px;font-weight:800;line-height:1.1}
.hero-num .num-label{font-size:15px;color:var(--ink-2)}
.legend{list-style:none;margin:14px 0 0;padding:0}
.legend li{display:grid;grid-template-columns:12px 1fr auto 42px;align-items:center;gap:10px;min-height:38px;font-size:15px}
.lg-val{font-weight:700}
.lg-share{font-size:13.5px;color:var(--ink-2);text-align:end}
.dup-row{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin-top:6px;padding:0 12px;border:0;border-radius:14px;background:var(--surface-2);font-size:14.5px;text-align:start;color:var(--ink)}
.dup-row span{flex:1}
.dup-row > .ic:first-child{color:var(--ink-2)}
.dup-row > .ic:last-child{color:var(--ink-3)}
.res-note{margin-top:14px;font-size:13.5px;line-height:1.65;color:var(--ink-2)}
.res-actions{margin-top:16px}
.link-row{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.link-row.single{grid-template-columns:1fr}
.link-row .link{justify-content:center;padding:0 4px;font-size:14px}
.disclosure{display:flex;align-items:center;justify-content:space-between;width:100%;height:46px;padding:0 6px;border:0;background:none;font-size:15.5px;font-weight:700;color:var(--ink)}
.disclosure .ic{color:var(--ink-2);transition:transform .2s}
.disclosure[aria-expanded="true"] .ic{transform:rotate(180deg)}
.mini-prog{display:block;height:3px;margin-top:8px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.mini-prog i{display:block;width:40%;height:100%;border-radius:2px;background:var(--accent);animation:slide 1.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(100%)}to{transform:translateX(-250%)}}

/* ---------- Sheets & dialogs ---------- */
.scrim{position:absolute;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.show{opacity:1;pointer-events:auto}
.scrim-top{z-index:60}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:41;display:flex;flex-direction:column;max-height:90%;border-radius:28px 28px 0 0;background:var(--surface);box-shadow:var(--shadow-sheet);transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.85,.25,1);visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet-grab{width:40px;height:5px;margin:10px auto 2px;border-radius:3px;background:var(--surface-3);flex:none}
.sheet-hd{display:flex;align-items:center;gap:8px;padding:4px 10px 6px 20px;padding-inline:20px 10px;flex:none}
.sheet-hd h3{flex:1;margin:0;font-size:19px;font-weight:800;line-height:1.4}
.sheet-hd-end{display:flex;align-items:center}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:4px 20px 22px;overscroll-behavior:contain}
.sheet-ft{flex:none;display:flex;gap:10px;padding:12px 20px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--rule)}
.sheet-label{margin:20px 4px 8px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.sheet-label:first-child{margin-top:8px}
.sheet-intro{margin:2px 0 14px;font-size:14.5px;line-height:1.7;color:var(--ink-2)}
.choice-list{display:flex;flex-direction:column;gap:2px}
.choice-list.sep{margin-top:10px;padding-top:10px;border-top:1px solid var(--rule)}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:0 14px;border:0;border-radius:14px;background:none;font-size:15.5px;font-weight:500;text-align:start;color:var(--ink)}
.choice:active{background:var(--surface-2)}
.choice:disabled{opacity:.45}
.choice > .ic:first-child{color:var(--ink-2)}
.choice.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
.choice.on > .ic{color:var(--accent-ink)}
.choice .tail{margin-inline-start:auto;font-size:13px;font-weight:500;color:var(--ink-2)}
.choice.on .tail{color:var(--accent-ink)}
.choice.danger,.choice.danger > .ic:first-child{color:var(--danger)}
.notice{display:flex;align-items:flex-start;gap:10px;margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--warn);font-size:14px;line-height:1.6}
.notice button{margin-top:4px}
.help{list-style:none;margin:4px 0 0;padding:0}
.help li{position:relative;padding:10px 26px 10px 0;padding-inline:26px 0;font-size:15px;line-height:1.75}
.help li + li{border-top:1px solid var(--rule)}
.help li::before{content:"";position:absolute;inset-inline-start:4px;top:20px;width:8px;height:8px;border-radius:3px;background:var(--accent)}
.about{text-align:center;padding:4px 6px 4px}
.about img{width:76px;height:76px;display:block;margin:0 auto}
.about h4{margin:12px 0 0;font-size:21px;font-weight:800}
.about p{margin-top:6px;font-size:15px;line-height:1.75;color:var(--ink-2)}

.dialog{position:absolute;z-index:61;inset-inline:22px;top:50%;padding:22px 22px 14px;border-radius:26px;background:var(--surface);opacity:0;visibility:hidden;transform:translateY(-46%) scale(.97);transition:opacity .2s,transform .2s,visibility .2s}
.dialog.open{opacity:1;visibility:visible;transform:translateY(-50%)}
.dialog h3{margin:0 0 8px;font-size:19px;font-weight:800;line-height:1.4}
.dialog p{font-size:15px;line-height:1.75;color:var(--ink-2)}
.dialog-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:18px}

.toast{position:absolute;z-index:80;bottom:calc(88px + env(safe-area-inset-bottom));inset-inline:16px;display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:16px;background:var(--ink);color:var(--paper);font-size:14.5px;line-height:1.5;opacity:0;transform:translateY(14px);transition:opacity .22s,transform .22s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.device.has-fab .toast{bottom:calc(156px + env(safe-area-inset-bottom))}
.toast .ic{color:var(--paper);opacity:.9}

/* ---------- Form controls ---------- */
.frows{border-radius:18px;background:var(--surface-2)}
.group .frows,.page-group{background:var(--surface)}
.frows > *{position:relative}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;padding:8px 14px;font-size:15px}
.frow > span:first-child{flex:1;min-width:0}
.frows > * + *::before{content:"";position:absolute;top:0;inset-inline:14px;height:1px;background:var(--rule)}
.frow.block{display:block;padding:12px 14px}
.frow.block > span:first-child{display:block;margin-bottom:8px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.sel-wrap{position:relative;display:inline-flex;align-items:center}
.sel-wrap select{appearance:none;-webkit-appearance:none;height:42px;min-width:74px;padding:0 12px;padding-inline-end:32px;border:1.5px solid var(--rule);border-radius:11px;background:var(--surface);font-size:15px;font-weight:700;color:var(--ink)}
.sel-wrap select:focus-visible{border-color:var(--accent);outline:none}
.sel-wrap .ic{position:absolute;inset-inline-end:10px;pointer-events:none;color:var(--ink-2)}
.sel-wrap.col select{text-align:center;text-align-last:center}
.sel-wrap.wide{display:flex}
.sel-wrap.wide select{width:100%;height:50px;border-radius:14px;font-weight:500}
.pad > .sel-wrap.wide select,.search-period select{background:var(--surface);border-color:transparent}
.input{width:100%;height:50px;padding:0 14px;border:1.5px solid transparent;border-radius:13px;background:var(--surface-2);font-size:16px;color:var(--ink)}
.input::placeholder{color:var(--ink-3)}
.input:focus{border-color:var(--accent);background:var(--surface)}
.frows .input{background:var(--surface)}
.num-input{width:74px;height:42px;border:1.5px solid var(--rule);border-radius:11px;background:var(--surface);font-size:15px;font-weight:700;text-align:center;color:var(--ink)}
.num-input:focus{border-color:var(--accent)}
.swatch{position:relative;display:inline-flex;align-items:center;gap:8px;height:42px;padding-inline:6px 12px;border:1.5px solid var(--rule);border-radius:11px;background:var(--surface);font-size:13.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.swatch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.swatch i{display:block;width:28px;height:28px;border-radius:8px}
.field{display:block}
.field-label{display:block;margin:0 4px 6px;font-size:13.5px;font-weight:700;color:var(--ink-2)}
.pair{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.pair .sel-wrap{display:flex}
.pair .sel-wrap select{width:100%;min-width:0;height:48px;border-radius:13px;font-weight:500;font-size:14.5px;background:var(--surface-2);border-color:transparent}
.filepick{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:10px 14px;border:1.5px dashed var(--surface-3);border-radius:16px;background:none;text-align:start;color:var(--ink)}
.filepick + .sheet-label{margin-top:16px}
.filepick > .ic{color:var(--ink-2)}
.filepick b{display:block;font-size:15px}
.filepick small{display:block;font-size:13px;color:var(--ink-2)}
.filepick.on{border-style:solid;border-color:var(--accent-soft);background:var(--accent-soft)}
.filepick.on > .ic{color:var(--accent-ink)}
.fetched{display:flex;align-items:center;gap:14px;margin-top:16px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--accent-ink);font-size:14px}
.fetched b{font-size:15px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;border-radius:13px;background:var(--surface-3)}
.seg button{height:40px;border:0;border-radius:10px;background:transparent;font-size:14.5px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(10,30,20,.12)}
.switch{position:relative;width:52px;height:32px;flex:none;border:0;border-radius:999px;background:var(--surface-3);transition:background-color .2s}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:26px;height:26px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.22);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(-20px);background:#fff}
.dot{display:inline-block;width:8px;height:8px;margin-inline-end:6px;border-radius:50%;background:var(--ink-3);vertical-align:1px}
.dot.ok{background:var(--accent)}

/* ---------- Results lists ---------- */
.sheet-search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:14px;background:var(--surface-2);color:var(--ink-3)}
.sheet-search input{flex:1;min-width:0;height:100%;border:0;background:none;font-size:16px;color:var(--ink);outline:none}
.sheet-search input::placeholder{color:var(--ink-3)}
.chips{display:flex;gap:6px;margin:12px -20px 4px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border:1.5px solid var(--rule);border-radius:999px;background:none;font-size:14px;font-weight:500;color:var(--ink-2)}
.chip b{font-weight:700;color:var(--ink)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.chip.on b{color:var(--accent-ink)}
.ulist{margin-top:6px}
.urow{display:grid;grid-template-columns:12px auto minmax(0,1fr) auto;align-items:center;gap:10px;min-height:50px;border-bottom:1px solid var(--rule);font-size:14.5px}
.uid{font-weight:700;font-variant-numeric:tabular-nums}
.utitle{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--ink-2)}
.utype{font-size:13px;color:var(--ink-2)}
.drow{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:12px 2px;border-bottom:1px solid var(--rule);font-size:14.5px}
.drow .muted{font-size:13px}
.un-sum{display:flex;align-items:baseline;gap:10px;margin:2px 4px 14px}
.un-sum b{font-size:34px;font-weight:800;line-height:1.1}
.un-sum span{font-size:14px;color:var(--ink-2)}
.empty-line{padding:28px 0;text-align:center;color:var(--ink-2)}
.kvrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:6px 14px;font-size:14.5px}
.kvrow b{font-size:16px}

/* ---------- Periods empty state ---------- */
.empty{padding:56px 28px 24px;text-align:center}
.empty img{width:84px;height:84px;display:block;margin:0 auto}
.empty h2{margin:18px 0 8px;font-size:23px;font-weight:800}
.empty p{margin-bottom:22px;font-size:15px;line-height:1.75;color:var(--ink-2)}

/* ---------- Adjustments ---------- */
.editor{border:1.5px solid transparent;border-radius:22px;background:var(--surface);overflow:hidden}
.editor:focus-within{border-color:var(--accent)}
.editor textarea{display:block;width:100%;min-height:196px;padding:14px 18px;border:0;background:none;resize:none;font-size:16.5px;line-height:1.95;color:var(--ink);outline:none}
.editor textarea::placeholder{color:var(--ink-3)}
.counters{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--rule)}
.cnt{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-2)}
.cnt.lead{background:var(--neutral-soft);color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(3,1fr);border-radius:20px;background:var(--surface)}
.figs.flat{background:var(--surface-2)}
.fig{position:relative;padding:16px 8px;text-align:center}
.fig + .fig::before{content:"";position:absolute;inset-block:16px;inset-inline-start:0;width:1px;background:var(--rule)}
.fig b{display:block;font-size:22px;font-weight:800;line-height:1.3}
.fig span{display:block;margin-top:2px;font-size:12.5px;color:var(--ink-2)}
.prog{height:6px;margin-top:14px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .5s ease}
.owed{display:flex;align-items:center;gap:8px;margin:12px 4px 14px;font-size:14px;color:var(--warn)}
.rtable{width:100%;margin-top:16px;border-collapse:collapse;font-size:14.5px}
.rtable th{padding:8px 4px;border-bottom:1px solid var(--rule);font-size:12.5px;font-weight:700;color:var(--ink-2);text-align:start}
.rtable td{padding:12px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
.rtable th:last-child,.rtable td:last-child{text-align:end}
.rtable td:first-child{font-weight:700;font-variant-numeric:tabular-nums}
.rtable .sub{display:block;margin-top:5px;font-size:12px;color:var(--ink-2)}

/* ---------- Search ---------- */
.searchbox{display:flex;align-items:center;gap:8px;height:60px;margin-top:18px;padding-inline:16px 6px;border:1.5px solid transparent;border-radius:20px;background:var(--surface)}
.searchbox:focus-within{border-color:var(--accent)}
.searchbox > .ic{color:var(--ink-3)}
.searchbox input{flex:1;min-width:0;height:100%;border:0;background:none;font-size:20px;font-weight:700;color:var(--ink);outline:none}
.searchbox input::placeholder{font-size:17px;font-weight:500;color:var(--ink-3)}
.search-opts{display:flex;gap:8px;margin-top:10px}
.search-opts .seg{flex:1}
.mini-input{display:flex;align-items:center;gap:4px;width:96px;height:46px;padding-inline:12px 10px;border-radius:13px;background:var(--surface);color:var(--ink-3)}
.mini-input input{width:100%;min-width:0;border:0;background:none;font-size:16px;font-weight:700;color:var(--ink);outline:none}
.search-period{margin-top:8px}
.s-empty{padding:52px 20px 0;text-align:center;color:var(--ink-2)}
.s-empty.sm{padding:24px 10px 12px}
.big-ic{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:var(--surface);color:var(--ink-3)}
.sheet .big-ic{background:var(--surface-2)}
.try-label{margin-top:22px;font-size:13px;color:var(--ink-3)}
.try{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.try button{height:38px;padding:0 14px;border:1.5px solid var(--rule);border-radius:999px;background:var(--surface);font-size:14.5px;font-weight:700;color:var(--ink)}
.s-msg{display:flex;align-items:flex-start;gap:10px;margin-top:16px;padding:14px 16px;border-radius:18px;background:var(--warn-soft);color:var(--warn);font-size:14.5px;line-height:1.65}
.rcard{margin-top:16px;padding:18px 18px 12px;border-radius:26px;background:var(--surface)}
.rc-head{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.avatar{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.rc-who{flex:1;min-width:0}
.rc-id{display:block;font-size:20px;font-weight:800;line-height:1.3;text-align:right}
.rc-name{display:block;font-size:14px;color:var(--ink-2)}
.rc-period{padding:10px 0 4px;border-bottom:1px solid var(--rule)}
.rc-pname{margin-bottom:2px;font-size:14px;font-weight:700}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;font-size:15px}
.kv > span:first-child{color:var(--ink-2)}
.kv b{font-size:16px;font-weight:700}
.cls{display:inline-flex;align-items:center;gap:7px;font-weight:700}
.kv-note{margin:-4px 0 6px;font-size:12.5px;color:var(--ink-3);text-align:end}
.rc-actions{display:flex;justify-content:center;gap:2px;margin-top:8px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

  function heroCard(p) {
    const a = p.audit, st = statusOf(p);
    let foot, cta;
    if (a.state === 'running') { foot = `<span data-run-label="${p.id}">${esc(a.prog.label)}…</span>`; cta = 'متابعة التدقيق'; }
    else if (a.state === 'done') { foot = `السجلات المدققة <b>${fmt(total(a.res))}</b>`; cta = 'عرض النتائج'; }
    else { foot = `سجلات الإدارة <b>${fmt(p.mgmt)}</b>، سجلات الوكيل <b>${fmt(p.agent)}</b>`; cta = 'تدقيق الفترة'; }
    return `<article class="hero">
      <div class="hero-top">${pill(st)}<button class="icon-btn sm" data-act="periodMenu" data-id="${p.id}" aria-label="إجراءات «${esc(p.name)}»">${ic('more')}</button></div>
      <h2 class="hero-title">${esc(p.name)}</h2>
      <p class="hero-meta">${srcLabel(p)}، ${esc(p.date)}</p>
      ${stripFor(p, 'lg')}
      <p class="hero-foot">${foot}</p>
      <button class="btn btn-primary btn-block" data-act="openAudit" data-id="${p.id}">${cta}</button>
    </article>`;
  }
  function periodRow(p) {
    const st = statusOf(p);
    return `<div class="prow">
      <button class="row-main" data-act="openAudit" data-id="${p.id}">
        <span class="row-ico">${ic(p.source === 'google' ? 'table' : 'file', 20)}</span>
        <span class="row-body"><span class="row-title">${esc(p.name)}</span>
          <span class="row-sub"><span class="st st-${st.tone}">${st.label}</span>، ${esc(p.date)}</span>
          ${stripFor(p, 'sm')}</span>
      </button>
      <button class="icon-btn sm" data-act="periodMenu" data-id="${p.id}" aria-label="إجراءات «${esc(p.name)}»">${ic('more')}</button>
    </div>`;
  }

  /* ---------- audit (a period's own screen) ---------- */
  function screenAudit(id) {
    const p = findP(id);
    if (!p) return '';
    const a = p.audit;
    const top = `<div class="topbar"><button class="back" data-act="back">${ic('back', 20)}<span>الفترات</span></button>
      <div class="topbar-end"><button class="icon-btn" data-act="help" data-k="audit" aria-label="شرح هذه الشاشة">${ic('help')}</button>
      <button class="icon-btn" data-act="periodMenu" data-id="${p.id}" data-from="audit" aria-label="إجراءات الفترة">${ic('more')}</button></div></div>`;
    const head = `<div class="phead"><h1 class="title">${esc(p.name)}</h1>

  /* ---------- adjustments ---------- */
  function parseAdj(text) {
    const out = [];
    text.split(/\r?\n/).forEach((ln, i) => {
      const t = ln.trim(); if (!t) return;
      const parts = t.split(/\s+/), id = parts[0], rest = parts.slice(1).join(' ');
      const type = /^خصم\s*كامل/.test(rest) ? 'full' : /^خصم/.test(rest) ? 'ded' : 'add';
      const m = rest.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫', '.').match(/-?\d+(\.\d+)?/);
      out.push({ id, type, amt: m ? parseFloat(m[0]) : 0, line: i + 1 });
    });
    return out;
  }
  function countAdj(text) {
    const ops = parseAdj(text), by = {};
    ops.forEach(o => { (by[o.id] = by[o.id] || new Set()).add(o.type); });
    return { lines: ops.length, adds: ops.filter(o => o.type === 'add').length, deds: ops.filter(o => o.type === 'ded').length, full: ops.filter(o => o.type === 'full').length, net: Object.values(by).filter(s => s.has('add') && s.has('ded')).length };
  }
  function salaryOf(id) { if (id in SAL) return SAL[id]; if (/^60\d{6}$/.test(id)) return Math.round(rng(id)() * 80) * 5; return null; }
  function computeAdj(text) {
    const groups = new Map();
    parseAdj(text).forEach(o => { if (!groups.has(o.id)) groups.set(o.id, []); groups.get(o.id).push(o); });
    const results = []; let adds = 0, deds = 0, owed = 0; const owedIds = [];
    for (const [id, list] of groups) {
      const s = salaryOf(id), full = list.some(o => o.type === 'full');
      const ad = list.filter(o => o.type === 'add').reduce((x, o) => x + o.amt, 0), de = list.filter(o => o.type === 'ded').reduce((x, o) => x + o.amt, 0);
      const note = ad > 0 && de > 0 ? `مقاصة: إضافة ${fmt(ad)}، خصم ${fmt(de)}` : '';
      if (s === null) { results.push({ id, st: 'غير موجود', tone: 'fail', amt: ad || de }); continue; }
      if (full) { results.push({ id, st: 'تم خصم الدين', tone: 'ok', amt: s }); deds += s; continue; }
      const net = ad - de;
      if (net > 0) { results.push({ id, st: `تم اضافة ${fmt(net)}`, tone: 'ok', amt: net, note }); adds += net; }
      else if (net === 0) results.push({ id, st: 'تمت المقاصة', tone: 'ok', amt: 0, note });
      else {
        const dd = -net;
        if (s === 0) results.push({ id, st: 'سحب ادارة', tone: 'fail', amt: dd, note });
        else if (s >= dd) { results.push({ id, st: s === dd ? 'تم الخصم بالكامل' : `تم خصم ${fmt(dd)}`, tone: 'ok', amt: dd, note }); deds += dd; }
        else { deds += s; owed += dd - s; owedIds.push(id); results.push({ id, st: 'باقي عليه', tone: 'wait', amt: dd - s, note }); }
      }
    }
    return { results, adds, deds, owed, owedIds };
  }

  function render(anim = 'none') {
    const v = view(), keep = anim === 'none' ? v.scrollTop : 0, top = S.stack[S.stack.length - 1];

  /* ---------- new / edit period ---------- */
  function newNP(p) {
    if (p) return { edit: p.id, mode: p.source === 'google' ? 'google' : 'file', stage: 2, mT: 'جدول الإدارة - نوفمبر', mS: SHEETS[0], aT: 'جدول الوكيل - نوفمبر', aS: SHEETS[0], mFile: p.source === 'file' ? 'الإدارة - سبتمبر.xlsx' : null, aFile: p.source === 'file' ? 'الوكيل - سبتمبر.xlsx' : null, loading: false, name: p.name, disc: String(p.discount), counts: { m: p.mgmt, a: p.agent }, extra: [] };
    return { edit: null, mode: S.google ? 'google' : 'file', stage: 1, mT: '', mS: SHEETS[0], aT: '', aS: SHEETS[0], mFile: null, aFile: null, loading: false, name: '', disc: '0', counts: null, extra: [] };
  }
  const npSheet = () => {
    const n = S.np, g = n.mode === 'google', tables = ALL_TABLES.concat(n.extra);
    const tSel = (k, l) => `<span class="sel-wrap"><select data-ch="np" data-k="${k}" aria-label="${l}"><option value="" ${n[k] ? '' : 'selected'}>اختر الجدول</option>${tables.map(x => `<option ${x === n[k] ? 'selected' : ''}>${esc(x)}</option>`).join('')}<option value="${LINK}">لصق رابط جدول Google…</option></select>${ic('down', 14)}</span>`;
    const sSel = (k, l) => `<span class="sel-wrap"><select data-ch="np" data-k="${k}" aria-label="ورقة ${l}">${SHEETS.map(x => `<option ${x === n[k] ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>${ic('down', 14)}</span>`;
    const pair = (label, t, s) => `<p class="sheet-label">${label}</p><div class="pair">${tSel(t, label)}${sSel(s, label)}</div>`;
    const file = (label, k, rows) => `<p class="sheet-label">${label}</p><button class="filepick ${n[k] ? 'on' : ''}" data-act="npPickFile" data-k="${k}">${ic('file', 22)}<span><b>${n[k] ? esc(n[k]) : 'اختيار ملف'}</b><small>${n[k] ? `${fmt(rows)} صف في الورقة الأولى` : 'لم يتم اختيار ملف (.xlsx, .csv)'}</small></span></button>`;
    const canFetch = g ? S.google && n.mT && n.aT : n.mFile && n.aFile;
    const body = `<div class="seg" role="group" aria-label="مصدر الجداول"><button aria-pressed="${g}" data-act="npMode" data-m="google">Google Sheets</button><button aria-pressed="${!g}" data-act="npMode" data-m="file">ملفات Excel / CSV</button></div>
      ${g ? (S.google ? '' : notice('سجّل الدخول بحساب Google من الإعدادات لاختيار الجداول، أو استخدم ملفات Excel / CSV.')) + pair('جدول الإدارة', 'mT', 'mS') + pair('جدول الوكيل', 'aT', 'aS')
        : file('ملف جدول الإدارة', 'mFile', 1240) + file('ملف جدول الوكيل', 'aFile', 1868)}
      ${n.stage === 1 ? `<button class="btn btn-secondary btn-block mt16" data-act="npFetch" ${canFetch && !n.loading ? '' : 'disabled'}>${n.loading ? (g ? 'جاري الجلب…' : 'جاري القراءة…') : g ? `${ic('cloud', 19)}جلب البيانات` : `${ic('file', 19)}تحميل الملفات`}</button>`
        : `<div class="fetched">${ic('check', 18)}<span>سجلات الإدارة <b>${fmt(n.counts.m)}</b></span><span>سجلات الوكيل <b>${fmt(n.counts.a)}</b></span></div>
          <label class="field mt16"><span class="field-label">اسم الفترة</span><input class="input" id="npName" value="${esc(n.name)}" placeholder="مثال: رواتب يناير 2026" data-in="npName"></label>
          <label class="field mt12"><span class="field-label">نسبة خصم التحويل (%)</span><input class="input" inputmode="decimal" value="${esc(n.disc)}" data-in="npDisc"></label>
          <p class="caption">تُحفظ مع الفترة. خصم التدقيق نفسه يُحدَّد من «إعداد التدقيق».</p>`}`;
    return { title: n.edit ? 'تعديل فترة الرواتب' : 'فترة رواتب جديدة', body,
      foot: n.stage === 2 ? `<button class="btn btn-quiet" data-act="closeSheet">إلغاء</button><button class="btn btn-primary grow" id="npSave" data-act="npSave" ${n.name.trim() ? '' : 'disabled'}>حفظ</button>` : '' };
  };
  function askLink(done) {
    openDialog({ title: 'رابط جدول Google', body: 'انسخ رابط الجدول من Google Sheets والصقه هنا.', ok: 'اختيار', input: { placeholder: 'https://docs.google.com/spreadsheets/d/…', label: 'رابط جدول Google', ltr: true },
      onOk: v => { if (!/docs\.google\.com\/spreadsheets\/d\//.test(v || '')) { toast('الرابط غير صالح. انسخ رابط الجدول من Google Sheets.', 'err'); return; } done('جدول من رابط'); } });
  }

  /* ================= audit simulation ================= */
  const STEPS_G = ['مزامنة جداول الفترة', 'قراءة بيانات المستخدمين', 'إنشاء أوراق الوجهة في جدول الإدارة', 'نسخ السجلات إلى أوراق الوكالات', 'كتابة الراتب والحالة', 'تلوين الصفوف في ورقة الإدارة', 'تلوين الصفوف في ورقة الوكيل', 'حفظ النتائج'];
  const STEPS_F = ['قراءة الملف', 'مطابقة السجلات', 'حفظ النتائج'];
  const visibleHas = p => { const t = S.stack[S.stack.length - 1]; return (t && t.type === 'audit' && t.id === p.id) || (!S.stack.length && S.tab === 'periods' && periods()[0] === p); };
  function refreshRun(p, full) {
    if (full) { if (visibleHas(p)) render(); return; }
    const pr = p.audit.prog;
    $$(`[data-sweep="${p.id}"]`).forEach(w => { w.setAttribute('aria-valuenow', pr.pct); const f = w.querySelector('.fill'); if (f) f.style.clipPath = `inset(0 0 0 ${100 - pr.pct}%)`; });
    $$(`[data-run-step="${p.id}"]`).forEach(el => { el.textContent = `الخطوة ${Math.min(pr.i + 1, pr.n)} من ${pr.n}`; });
    $$(`[data-run-label="${p.id}"]`).forEach(el => { el.textContent = pr.label + '…'; });
  }
  function startAudit(p) {
    if (!p || p.locked) return;
    const a = p.audit;
    if (a.state === 'running') return;
    if (!a.src) { toast('اختر مصدر بيانات المستخدمين أولاً', 'err'); return; }
    a.steps = isG(p) ? STEPS_G : STEPS_F;
    a.target = p.preset || a.res || simRes(p);
    a.state = 'running'; a.prog = { i: 0, n: a.steps.length, pct: 0, label: a.steps[0], waiting: false };
    p._rows = null; S.ui.details = false;
    render();
    a.timer = setTimeout(() => stepAudit(p), 380);
  }
  function stepAudit(p) {
    const a = p.audit, pr = a.prog;
    if (a.state !== 'running') return;
    if (pr.i >= pr.n) { finishAudit(p); return; }
    pr.label = a.steps[pr.i];
    if (isG(p) && pr.i === 5 && !S.demoWaited) {
      S.demoWaited = true; pr.waiting = true; pr.label = 'تلوين الصفوف في ورقة الإدارة: انقطع الاتصال، سيُستأنف تلقائيًا';
      refreshRun(p, true); a.timer = setTimeout(() => resumeAudit(p), 3200); return;
    }
    pr.pct = Math.round(((pr.i + 0.7) / pr.n) * 100);
    refreshRun(p);
    a.timer = setTimeout(() => { pr.i++; stepAudit(p); }, isG(p) ? 820 : 950);
  }
  function resumeAudit(p) {
    const a = p.audit;
    if (!a.prog || !a.prog.waiting) return;
    clearTimeout(a.timer); a.prog.waiting = false; a.prog.label = a.steps[a.prog.i];
    refreshRun(p, true); a.timer = setTimeout(() => stepAudit(p), 450);
  }
  function finishAudit(p) {
    const a = p.audit;
    a.prog.pct = 100; refreshRun(p);
    setTimeout(() => {
      a.state = 'done'; a.res = a.target; a.prog = null; a.at = { day: 'اليوم', time: nowTime() };
      a.tools = { t1: 'idle', t2: 'idle' }; a.unaudited = genUnaudited(p, isG(p) ? 27 : 19);
      if (visibleHas(p)) render();
      toast(a.res.dup ? `اكتمل التدقيق، مع أرقام مكررة: ${fmt(a.res.dup)}` : 'اكتمل التدقيق');
    }, 650);
  }
  function runTool(p, k) {
    const a = p.audit; a.tools[k] = 'running'; render();
    setTimeout(() => {
      a.tools[k] = 'done';
      if (k === 't1') { const n = (a.unaudited || []).length; a.unaudited = []; toast(`اكتمل تدقيق غير المذكورين: ${nNums(n)}`); }
      else toast(`اكتمل نقل سجلات الإدارة غير الملوّنة: ${nRows(14)}`);
      if (visibleHas(p)) render();
    }, 2600);
  }

  /* ================= actions ================= */
  function switchWs(id) {
    const w = S.workspaces.find(x => x.id === id); if (!w) return;
    S.ws = id; S.stack = []; S.search.pid = null;
    closeSheet(false); render('fade'); toast(`انتقلت إلى «${esc(w.name)}»`, 'info');
  }
  function promptWs(id) {
    const w = id ? S.workspaces.find(x => x.id === id) : null;
    openDialog({ title: w ? 'إعادة تسمية مساحة العمل' : 'مساحة عمل جديدة', body: w ? '' : 'لكل مساحة فتراتها وتدقيقها وإعداداتها، منفصلة عن غيرها.', ok: 'حفظ',
      input: { value: w ? w.name : '', placeholder: 'مثال: شركة النور', label: 'اسم مساحة العمل' },
      onOk: v => {
        const name = (v || '').trim(); if (!name) { toast('اكتب اسم مساحة العمل', 'err'); return; }
        if (w) { w.name = name; closeSheet(false); render(); toast('تمت إعادة التسمية'); return; }
        const nid = 'ws' + Date.now(); S.workspaces.push({ id: nid, name }); S.periods[nid] = [];
        S.ws = nid; S.stack = []; S.tab = 'periods'; closeSheet(false); render('fade'); toast(`تم إنشاء «${esc(name)}»`);
      } });
  }
  const A = {

      const w = S.workspaces.find(x => x.id === d.id);
      openDialog({ title: 'حذف مساحة العمل', body: `سيُحذف من هذا الهاتف كل ما في «${esc(w.name)}»: الفترات وحالات التدقيق والإعدادات وربط الحقول. لا يُحذف شيء من Google.`, ok: 'حذف', kind: 'danger',
        onOk: () => { S.workspaces = S.workspaces.filter(x => x.id !== w.id); delete S.periods[w.id]; if (S.ws === w.id) { S.ws = 'main'; S.stack = []; } closeSheet(false); render(); toast(`تم حذف «${esc(w.name)}»`); } });
    },
    manageWs: () => { closeSheet(false); S.tab = 'settings'; S.stack = []; render('fade'); },
    /* periods */
    openAudit: d => { closeSheet(false); S.ui.details = false; S.tab = 'periods'; S.stack = [{ type: 'audit', id: d.id }]; render('push'); },
    periodMenu: d => openSheet(periodMenuSheet(d.id, d.from)),
    newPeriod: () => { S.np = newNP(); openSheet(npSheet); },
    editPeriod: d => { S.np = newNP(findP(d.id)); openSheet(npSheet); },
    npMode: d => { const n = S.np; if (n.mode === d.m) return; n.mode = d.m; if (!n.edit) n.stage = 1; paintSheet(); },
    npPickFile: d => { S.np[d.k] = d.k === 'mFile' ? 'الإدارة - نوفمبر.xlsx' : 'الوكيل - نوفمبر.csv'; if (!S.np.edit) S.np.stage = 1; paintSheet(); },
    npFetch: () => {
      const n = S.np; n.loading = true; paintSheet();
      setTimeout(() => { n.loading = false; n.stage = 2; n.counts = { m: 1240, a: 1868 }; paintSheet(); toast(n.mode === 'google' ? 'تم جلب البيانات' : 'تم قراءة الملفات'); const el = $('#npName'); if (el) el.focus(); }, 1000);
    },
    npSave: () => {
      const n = S.np, name = n.name.trim(); if (!name) return;
      const disc = parseFloat(n.disc) || 0, source = n.mode === 'google' ? 'google' : 'file';
      if (n.edit) { const p = findP(n.edit); p.name = name; p.discount = disc; if (p.source !== source) { p.source = source; if (p.audit.state !== 'running') p.audit.src = null; } closeSheet(); toast('حُدّثت فترة الرواتب'); return; }
      const p = P({ name, source, mgmt: n.counts.m, agent: n.counts.a, discount: disc });
      p.audit.cfg = cfgFrom(S.fields); periods().unshift(p); S.search.pid = null;
      closeSheet(false); S.tab = 'periods'; S.stack = []; render('fade'); toast('حُفظت فترة الرواتب');
    },
    syncPeriod: () => { closeSheet(); toast('تمت مزامنة جداول الفترة'); },
    toggleLock: d => {
      const p = findP(d.id);
      if (p.audit.state === 'running') { toast('انتظر حتى ينتهي التدقيق', 'info'); return; }
      p.locked = !p.locked; closeSheet(false); render(); toast(p.locked ? 'أُقفل التدقيق' : 'أُعيد فتح التدقيق');
    },
    deletePeriod: d => {
      const p = findP(d.id);
      openDialog({ title: 'حذف فترة الرواتب', body: `سيُحذف «${esc(p.name)}» من هذا الهاتف مع حالات تدقيقها. لا يُحذف أي شيء من Google، ولا يمكن التراجع.`, ok: 'حذف', kind: 'danger',
        onOk: () => { clearTimeout(p.audit.timer); for (const k in S.periods) S.periods[k] = S.periods[k].filter(x => x !== p); const anim = S.stack.length ? 'pop' : 'none'; S.stack = S.stack.filter(x => x.id !== p.id); closeSheet(false); render(anim); toast('حُذفت فترة الرواتب'); } });
    },
    /* audit */
    srcSheet: d => openSheet(srcSheet(d.id)),
    pickSrc: d => { findP(d.id).audit.src = { kind: 'google', name: d.name }; closeSheet(); },
    srcLink: d => askLink(name => { findP(d.id).audit.src = { kind: 'google', name }; closeSheet(); toast('تم اختيار الجدول من الرابط'); }),
    pickFile: d => { findP(d.id).audit.src = { kind: 'file', name: 'معلومات المستخدمين.xlsx' }; closeSheet(); },
    cfgSheet: d => openSheet(cfgSheet(d.id)),
    saveDefault: () => toast('تم حفظ إعدادات التدقيق كإعداد افتراضي'),
    startAudit: d => startAudit(findP(d.id)),
    resume: d => resumeAudit(findP(d.id)),
    rowsSheet: d => { S.ui.rowsQ = ''; S.ui.rowsF = 'all'; S.ui.rowsP = d.id; openSheet(rowsSheet(d.id)); },
    rowsFilter: d => { S.ui.rowsF = d.f; paintSheet(); },
    dupSheet: d => openSheet(dupSheet(d.id)),
    diagSheet: d => openSheet(diagSheet(d.id)),
    unSheet: d => { S.ui.unQ = ''; openSheet(unSheet(d.id)); },
    unCopy: d => {
      const p = findP(d.id), q = S.ui.unQ.trim(), list = (p.audit.unaudited || []).filter(x => !q || x.id.indexOf(q) >= 0 || x.name.indexOf(q) >= 0);
      if (d.m === 'ids') { copyText(list.map(x => x.id).join('\n')); toast(`تم نسخ ${nNums(list.length)}`); }
      else { copyText(list.map(x => `${x.id}\t${x.name}`).join('\n')); toast(`تم نسخ ${nRows(list.length)} (الرقم والاسم)`); }
    },
    tool1: d => openDialog({ title: 'تدقيق غير المذكورين', body: `سيُضاف كل رقم في ورقة الوكيل غير موجود في بيانات المستخدمين مرة واحدة، في صفوف جديدة بعنوان «${esc(S.fields.unText)}»، ثم تُدقق هذه الصفوف وحدها. لا تتغير الصفوف الموجودة.`, ok: 'إضافة وتدقيق', onOk: () => runTool(findP(d.id), 't1') }),
    tool2: d => openDialog({ title: 'نقل سجلات الإدارة غير الملوّنة', body: `ستُنسخ صفوف ورقة الإدارة غير الملوّنة وغير المدققة، التي فيها مبلغ غير صفري في العمود ${esc(S.fields.mgmtShare)} وصاحبها غير موجود في بيانات المستخدمين، إلى ورقة «${esc(S.fields.unText)}» وتُلوَّن بلون غير المذكورين. يُفضّل تنفيذ «١» قبلها.`, ok: 'نقل السجلات', onOk: () => runTool(findP(d.id), 't2') }),
    openGs: d => toast(d.k === 'mgmt' ? 'يُفتح جدول الإدارة في Google Sheets' : 'يُفتح جدول بيانات المستخدمين في Google Sheets', 'info'),
    exportXlsx: d => toast(`تم حفظ ملف Excel: تدقيق ${esc(findP(d.id).name)}.xlsx`),
    toggleDetails: () => { S.ui.details = !S.ui.details; render(); },
    /* adjustments */
    adjTable: () => openSheet(adjTableSheet),
    adjCols: () => openSheet(adjColsSheet),
    adjPaste: () => { S.adj.text = SAMPLE_ADJ; render(); },
    adjClear: () => { S.adj.text = ''; render(); const t = $('#adjText'); if (t) t.focus(); },
    adjApply: () => {
      const a = S.adj;
      if (a.state === 'running') { toast('يوجد تطبيق تسويات قيد التنفيذ. انتظر انتهاءه.', 'info'); return; }
      a.state = 'running'; a.prog = 8; render();
      const rc = $('#adjProg'); if (rc) rc.closest('.run-card').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      const iv = setInterval(() => { a.prog = Math.min(96, a.prog + 22); const b = $('#adjProg'); if (b) b.style.width = a.prog + '%'; }, 450);
      setTimeout(() => {
        clearInterval(iv); a.state = 'idle'; a.last = computeAdj(a.text); a.pushed = false; a.pushing = false;
        if (S.tab === 'adjust' && !S.stack.length) { render(); openSheet(reportSheet); }
        toast('اكتمل تطبيق التسويات');
      }, 2300);
    },
    adjReport: () => openSheet(reportSheet),
    adjCopy: () => { const l = S.adj.last; copyText(l.results.map(r => `${r.id}\t${r.st}\t${r.amt}`).join('\n')); toast('نُسخ الجدول والملخص. الصقه في Excel.'); },
    adjPush: () => { const a = S.adj; a.pushing = true; paintSheet(); setTimeout(() => { a.pushing = false; a.pushed = true; paintSheet(); toast('تمت الكتابة في ورقة «إضافات وخصومات»'); }, 1300); },
    openPushed: () => toast('تُفتح ورقة «إضافات وخصومات» في Google Sheets', 'info'),
    /* search */
    scope: d => { S.search.scope = d.v; render(); },
    tryId: d => { S.search.q = d.v; render(); },
    searchPaste: () => { S.search.q = '60398584'; render(); },
    copyCard: () => { copyText(`رقم المستخدم: ${S.search.q}`); toast('تم نسخ النتائج كبطاقة نصية'); },
    saveImage: () => toast('تم حفظ الصورة'),
    selective: d => { const c = findP(d.pid).audit.cfg; S.selDraft = { pid: d.pid, uid: d.uid, target: '', newName: '', agent: c.agent, mgmt: c.mgmt, running: false }; openSheet(selSheet); },
    runSelective: () => {
      const d = S.selDraft;
      if (!d.target && !d.newName.trim()) { toast('اختر ورقة هدف أو اكتب اسمًا لورقة جديدة', 'err'); return; }
      d.running = true; paintSheet();
      setTimeout(() => { S.search.sel[d.pid + ':' + d.uid] = true; closeSheet(false); paintSearch(); toast(`تم التدقيق الانتقائي للمستخدم <bdi dir="ltr">${esc(d.uid)}</bdi>`); }, 1100);
    },
    /* settings */
    toggleGoogle: () => {
      if (S.google) {
        openDialog({ title: 'فصل حساب Google؟', body: 'يتوقف التدقيق على Google والمزامنة حتى تربط الحساب من جديد. تبقى الفترات ونتائجها على الهاتف.', ok: 'فصل', kind: 'danger',
          onOk: () => { S.google = false; S.autoSync = false; render(); toast('تم فصل حساب Google'); } });
        return;
      }
      S.connecting = true; render();
      setTimeout(() => { S.connecting = false; S.google = true; render(); toast('تم ربط حساب Google'); }, 1000);
    },
    toggleSync: () => { if (!S.google) { toast('يرجى إعداد Google Sheets أولاً', 'err'); return; } S.autoSync = !S.autoSync; render(); toast(S.autoSync ? 'تم تفعيل المزامنة' : 'تم إيقاف المزامنة'); },
    theme: d => { S.theme = d.v; applyTheme(); render(); },
    openFields: () => { S.fdraft = Object.assign({}, S.fields); S.stack = [{ type: 'fields' }]; render('push'); },
    resetFields: () => { S.fdraft = defaultFields(); render(); toast('أُعيدت الأعمدة الافتراضية. اضغط «حفظ ربط الحقول» لتطبيقها.', 'info'); },
    saveFields: () => {
      const bad = ['unIdCols', 'unTextCols'].some(k => !/^\s*[A-Za-z]{1,2}(\s*,\s*[A-Za-z]{1,2})*\s*$/.test(S.fdraft[k]));
      if (bad) { toast('اكتب حروف أعمدة صحيحة مفصولة بفاصلة (مثل: A, E).', 'err'); return; }
      S.fields = Object.assign({}, S.fdraft);
      periods().forEach(p => { if (p.audit.state !== 'running') Object.assign(p.audit.cfg, { mgmtId: S.fields.mgmtId, agentId: S.fields.agentId, agentSal: S.fields.agentSal, userId: S.fields.userId, agency: S.fields.agency, salW: S.fields.salW, statW: S.fields.statW }); });
      S.stack = []; render('pop'); toast(`حُفظ ربط حقول «${esc(curWs().name)}» وطُبِّق على شاشة التدقيق`);
    },
    about: () => openSheet(aboutSheet),
  };
  const I = {
    cfgNum: el => { findP(el.dataset.id).audit.cfg[el.dataset.k] = parseFloat(el.value) || 0; },
    cfgColor: el => { findP(el.dataset.id).audit.cfg[el.dataset.k] = el.value; paintSwatch(el); },
    selColor: el => { S.selDraft[el.dataset.k] = el.value; paintSwatch(el); },
    fieldColor: el => { S.fdraft[el.dataset.k] = el.value; paintSwatch(el); },
    fieldText: el => { S.fdraft[el.dataset.k] = el.value; },
    rowsQ: el => { S.ui.rowsQ = el.value; const l = $('#rowsList'); if (l) l.innerHTML = rowsList(findP(el.dataset.id)); },
    unQ: el => {
      S.ui.unQ = el.value; const p = findP(el.dataset.id), q = el.value.trim();
      const vis = q ? p.audit.unaudited.filter(x => x.id.indexOf(q) >= 0 || x.name.indexOf(q) >= 0) : p.audit.unaudited;
      $('#unList').innerHTML = unList(vis); $('#unNote').textContent = q ? `النسخ يشمل ${fmt(vis.length)} من نتائج البحث فقط.` : '';
    },
    adjText: el => { S.adj.text = el.value; const c = countAdj(el.value); $('#adjCounters').innerHTML = countersHtml(c); const b = $('#adjApply'); if (b) b.disabled = !(c.lines && S.google); },
    searchQ: el => { S.search.q = el.value.trim(); paintSearch(220); },
    searchDisc: el => { S.search.disc = el.value; paintSearch(120); },
    npName: el => { S.np.name = el.value; const b = $('#npSave'); if (b) b.disabled = !el.value.trim(); },
    npDisc: el => { S.np.disc = el.value; },
    selName: el => { S.selDraft.newName = el.value; },
  };
  function paintSwatch(el) { const l = el.closest('.swatch'); if (!l) return; l.querySelector('i').style.background = el.value; l.querySelector('bdi').textContent = el.value; }
  const C = {
    cfg: el => { findP(el.dataset.id).audit.cfg[el.dataset.k] = el.value; },
    field: el => { S.fdraft[el.dataset.k] = el.value; },
    adj: el => { S.adj[el.dataset.k] = el.value; },
    searchPeriod: el => { S.search.pid = el.value; paintSearch(); },
    selTarget: el => { S.selDraft.target = el.value; },
    np: el => {
      const n = S.np, k = el.dataset.k;
      if (el.value === LINK) { el.value = n[k]; askLink(name => { if (n.extra.indexOf(name) < 0) n.extra.push(name); n[k] = name; if (!n.edit) n.stage = 1; paintSheet(); }); return; }
      n[k] = el.value; if (!n.edit) n.stage = 1; paintSheet();
    },
  };

  /* ================= events ================= */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    const fn = A[t.dataset.act];
    if (fn) { e.preventDefault(); fn(t.dataset, t, e); }
  });
  document.addEventListener('input', e => { const t = e.target; if (t.dataset && I[t.dataset.in]) I[t.dataset.in](t, e); });
  document.addEventListener('change', e => { const t = e.target; if (t.dataset && C[t.dataset.ch]) C[t.dataset.ch](t, e); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if ($('#dialog').classList.contains('open')) closeDialog(); else if (sheetFn) closeSheet(); }
    if (e.key === 'Enter' && e.target && e.target.id === 'dlgIn') A.dlgOk();
  });
  $('#dscrim').addEventListener('click', closeDialog);

  /* ================= theme & boot ================= */
  const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function applyTheme() {
    const dark = S.theme === 'dark' || (S.theme === 'auto' && mq && mq.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const m = $('meta[name="theme-color"]'); if (m) m.setAttribute('content', dark ? '#101613' : '#F1F4F0');
  }
  if (mq && mq.addEventListener) mq.addEventListener('change', () => { if (S.theme === 'auto') applyTheme(); });
  function tickClock() { const d = new Date(), el = $('#clock'); if (el) el.textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`; }
  tickClock(); setInterval(tickClock, 30000);
  $('#fab').innerHTML = `${ic('plus', 22)}<span>فترة جديدة</span>`;
  applyTheme();
  render();
})();

</script>
</body>
</html>
